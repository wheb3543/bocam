name: "🐛 تقرير عن خطأ (Bug Report)"
description: "الإبلاغ عن خلل أو مشكلة تقنية في نظام BOCAM CRM"
title: "[BUG]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        شكرًا لك على رغبتك في الإبلاغ عن مشكلة في نظام BOCAM CRM! يرجى ملء هذا النموذج لمساعدتنا في تشخيص المشكلة وإصلاحها بأسرع وقت ممكن.
  - type: dropdown
    id: module
    attributes:
      label: "📁 الوحدة المتأثرة (Affected Module)"
      description: "ما هو القسم أو الموديول الذي واجهت فيه المشكلة؟"
      options:
        - "📅 [01] المواعيد والحجوزات والجدولة الذكية والمخيمات (Booking & Scheduling)"
        - "👥 [02] إدارة المرضى والسجل الطبي الإلكتروني (CRM & Patients / EMR)"
        - "💬 [03] صندوق المحادثات الموحد وواتساب (Omni-channel Inbox & WhatsApp)"
        - "📢 [04] حملات التسويق والبث والنشر (Marketing & Publishing)"
        - "🌐 [05] إدارة المحتوى والبوابة العامة والمدونة (CMS & Public Portal)"
        - "📋 [06] إدارة المهام والمشاريع وتقييم الأداء (Tasks & Projects)"
        - "🔐 [07] المستخدمون والأدوار والصلاحيات (Users & RBAC)"
        - "💳 [08] الفواتير والمدفوعات والعروض (Financial & Billing)"
        - "📊 [09] التقارير والإحصائيات والتحليلات (Reports & Analytics)"
        - "⚙️ [10] إعدادات النظام وسجلات التدقيق (System Settings & Audit)"
        - "🔄 الأنظمة المستقلة: النسخ الاحتياطي، التحديث التلقائي، الترخيص (Subsystems)"
        - "🛠️ البنية التحتية، السكريبتات، وقواعد البيانات (Infrastructure & DB)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "📝 وصف المشكلة (Description)"
      description: "اشرح المشكلة بوضوح واختصار."
      placeholder: "ماذا حدث؟ وكيف تؤثر المشكلة على تجربة الاستخدام؟"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "👣 خطوات إعادة إنتاج المشكلة (Steps to Reproduce)"
      description: "ما هي الخطوات الدقيقة التي قمت بها لتظهر هذه المشكلة؟"
      placeholder: |
        1. انتقل إلى صفحة '...'
        2. اضغط على زر '...'
        3. أدخل البيانات التالية '...'
        4. شاهد الخطأ يظهر...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: "🎯 السلوك المتوقع مقارنة بالفعلي"
      description: "ما الذي كان ينبغي حدوثه؟ وما الذي حدث بالفعل؟"
      placeholder: |
        السلوك المتوقع: ينبغي إرسال رسالة واتساب بنجاح وتحديث الحالة إلى 'مكتمل'.
        السلوك الفعلي: يفشل الإرسال وتظهر رسالة خطأ في الـ Webhook.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "📋 سجلات الأخطاء أو البيانات البرمجية (Logs / Stack Trace)"
      description: "انسخ هنا أي سجلات أخطاء من متصفح الويب (Console) أو السيرفر إذا كانت متوفرة."
      render: bash
      placeholder: "مثال: Error: Connection refused at..."
  - type: input
    id: environment
    attributes:
      label: "💻 بيئة التشغيل (Environment Details)"
      description: "مثال: Chrome v120, Node.js v22.13, macOS, MySQL 8.0"
      placeholder: "Browser, OS, Node Version, etc."
    validations:
      required: false
