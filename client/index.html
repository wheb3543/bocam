<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/tenant-assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/tenant-assets/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/tenant-assets/apple-touch-icon.png" />
    <title>%VITE_APP_TITLE%</title>

    <!-- PWA Manifest - Re-enabled for PWA functionality -->
    <link rel="manifest" id="pwa-manifest" href="/manifest.json" />
    <script>
      // Switch manifest BEFORE React loads - critical for PWA install dialog
      (function () {
        var path = window.location.pathname;
        var isAdmin = path.startsWith('/admin') || path.startsWith('/dashboard');
        var tenant = window.__BOCAM_TENANT__ || {};
        var tenantName = tenant.companyArabicName || tenant.companyName || 'BOCAM';
        var tenantTitle = tenant.companyEnglishName || tenant.companyName || 'BOCAM';

        if (tenantName) {
          document.title = tenantName;
        }

        if (tenant.companyLogo) {
          var favicon = document.querySelector('link[rel="icon"]');
          if (favicon) favicon.href = tenant.companyLogo;
        }

        if (isAdmin) {
          document.getElementById('pwa-manifest').href = '/manifest-admin.json';
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.content = '#1e40af';
          if (!tenantName) document.title = 'لوحة التحكم';
        } else if (tenantTitle) {
          document.title = tenantTitle;
        }
      })();
    </script>

    <!-- PWA Meta Tags - Re-enabled for PWA functionality -->
    <meta name="theme-color" content="#00A651" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="منصة الحجز" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="منصة حجز المواعيد والخدمات الطبية"
    />
    <meta
      name="keywords"
      content="حجز موعد, أطباء, عروض طبية, مخيمات صحية, استشارات طبية"
    />
    <meta name="author" content="BOCAM" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="منصة الحجز" />
    <meta property="og:title" content="منصة الحجز | احجز موعدك الآن" />
    <meta
      property="og:description"
      content="منصة حجز المواعيد والخدمات الطبية"
    />
    <meta property="og:image" content="/tenant-assets/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="/" />
    <meta property="og:locale" content="ar_YE" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="منصة الحجز | احجز موعدك الآن" />
    <meta
      name="twitter:description"
      content="منصة حجز المواعيد والخدمات الطبية"
    />
    <meta name="twitter:image" content="/tenant-assets/og-image.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://manus-analytics.com" />
    <link rel="preconnect" href="https://sr-client-cfg.amplitude.com" />
    <link rel="dns-prefetch" href="https://manuscdn.com" />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Install Prompt -->
    <noscript>
      <div style="text-align: center; padding: 20px; background: #fef3c7; color: #92400e">
        يرجى تفعيل JavaScript لاستخدام هذا التطبيق
      </div>
    </noscript>
    <script type="module">
      const analyticsEndpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const analyticsWebsiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;

      if (analyticsEndpoint && analyticsWebsiteId) {
        const analyticsScript = document.createElement('script');
        analyticsScript.defer = true;
        analyticsScript.src = `${analyticsEndpoint}/umami`;
        analyticsScript.dataset.websiteId = analyticsWebsiteId;
        document.body.appendChild(analyticsScript);
      }
    </script>
  </body>
</html>
